name: Release SA-MP

on:
  push:
    tags:
      - 'v*-samp'

permissions:
  contents: write

jobs:
  linux:
    name: Package SA-MP Linux 32-bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ g++-multilib
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DSAMP_PROFILER_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_SHARED_LINKER_FLAGS=-m32
          cmake --build build -j$(nproc)
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p package/samp-profiler-samp-linux-x86
          cp build/samp-profiler.so package/samp-profiler-samp-linux-x86/
          cp plugin/samp_profiler.inc examples/test.pwn README.md LICENSE package/samp-profiler-samp-linux-x86/
          mkdir -p dist
          tar -czf dist/samp-profiler-samp-linux-x86.tar.gz -C package samp-profiler-samp-linux-x86
      - uses: actions/upload-artifact@v4
        with:
          name: samp-linux-package
          path: dist/samp-profiler-samp-linux-x86.tar.gz

  windows:
    name: Package SA-MP Windows 32-bit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        run: |
          cmake -S . -B build -A Win32 -DSAMP_PROFILER_BUILD_TESTS=ON
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\samp-profiler-samp-windows-x86, dist | Out-Null
          Copy-Item build\Release\samp-profiler.dll package\samp-profiler-samp-windows-x86\
          Copy-Item plugin\samp_profiler.inc, examples\test.pwn, README.md, LICENSE package\samp-profiler-samp-windows-x86\
          Compress-Archive -Path package\samp-profiler-samp-windows-x86 -DestinationPath dist\samp-profiler-samp-windows-x86.zip
      - uses: actions/upload-artifact@v4
        with:
          name: samp-windows-package
          path: dist/samp-profiler-samp-windows-x86.zip

  publish:
    name: Publish SA-MP release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: samp-*-package
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GH_REPO" \
              --title "samp-profiler $GITHUB_REF_NAME — SA-MP" --generate-notes
          fi
